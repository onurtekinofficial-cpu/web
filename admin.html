<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — AI Video Producer Portfolio</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink: '#050505', panel: '#0d0f0d', muted: '#82867e', accent: '#CCFF00' },
          fontFamily: { display: ['"Space Grotesk"', 'sans-serif'], sans: ['Inter', 'sans-serif'], mono: ['"JetBrains Mono"', 'monospace'] },
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #050505;
      background-image: radial-gradient(ellipse 60% 30% at 15% -10%, rgba(204, 255, 0, .06), transparent 60%);
    }

    .font-display {
      font-family: 'Space Grotesk', sans-serif;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    * {
      -webkit-tap-highlight-color: transparent;
    }

    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: #1c1f1b;
      border-radius: 8px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #CCFF00;
    }

    *:focus-visible {
      outline: 2px solid #CCFF00;
      outline-offset: 2px;
    }

    /* ---- shared components ---- */
    .card {
      background: #0d0f0d;
      border: 1px solid rgba(255, 255, 255, .09);
      border-radius: 14px;
      padding: 18px;
    }

    @media (min-width: 640px) {
      .card {
        padding: 24px;
      }
    }

    .card-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
    }

    .card-sub {
      color: #82867e;
      font-size: .85rem;
      margin: 2px 0 16px;
    }

    .label {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #82867e;
      margin-bottom: 6px;
    }

    .hint {
      display: block;
      font-size: 12px;
      color: #6b6f66;
      margin-top: 6px;
      line-height: 1.45;
    }

    .input {
      width: 100%;
      min-height: 46px;
      padding: 0 14px;
      background: rgba(255, 255, 255, .03);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 8px;
      color: #eef0ec;
      font-size: 15px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    textarea.input {
      padding: 12px 14px;
      line-height: 1.5;
      resize: vertical;
      min-height: 90px;
    }

    select.input {
      background-color: #0d0f0d;
    }

    .input:focus {
      border-color: #CCFF00;
      box-shadow: 0 0 0 3px rgba(204, 255, 0, .12);
    }

    .input::placeholder {
      color: #565a52;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #eef0ec;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, .14);
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }

    .btn:hover {
      border-color: rgba(204, 255, 0, .5);
      color: #CCFF00;
    }

    .btn:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .btn:disabled:hover {
      border-color: rgba(255, 255, 255, .14);
      color: #eef0ec;
    }

    .btn-primary {
      background: #CCFF00;
      color: #050505;
      border-color: #CCFF00;
    }

    .btn-primary:hover {
      color: #050505;
      box-shadow: 0 0 20px rgba(204, 255, 0, .35);
    }

    .btn-danger:hover {
      border-color: #f87171;
      color: #f87171;
    }

    .btn-sm {
      min-height: 38px;
      padding: 0 12px;
      font-size: 13px;
    }

    .btn-icon {
      width: 36px;
      padding: 0;
      flex-shrink: 0;
    }

    .pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, .14);
      color: #a3a79c;
      white-space: nowrap;
    }

    .pill-accent {
      color: #CCFF00;
      border-color: rgba(204, 255, 0, .4);
      background: rgba(204, 255, 0, .08);
    }

    .pill-order {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(204, 255, 0, .1);
      color: #CCFF00;
      border: 1px solid rgba(204, 255, 0, .35);
      flex-shrink: 0;
    }

    .savebar {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding-top: 6px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      z-index: 100;
      padding: 11px 18px;
      border-radius: 10px;
      background: #131513;
      border: 1px solid rgba(204, 255, 0, .5);
      font-size: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .6);
    }

    /* ---- sidebar: fixed on desktop, slide-in drawer on mobile ---- */
    #sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: 260px;
      z-index: 60;
      display: flex;
      flex-direction: column;
      background: #080a08;
      border-right: 1px solid rgba(255, 255, 255, .09);
      transform: translateX(-100%);
      transition: transform .25s ease;
    }

    #sidebar.open {
      transform: none;
    }

    @media (min-width: 1024px) {
      #sidebar {
        transform: none;
      }
    }

    #scrim {
      position: fixed;
      inset: 0;
      z-index: 55;
      background: rgba(0, 0, 0, .7);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }

    #scrim.open {
      opacity: 1;
      pointer-events: auto;
    }

    @media (min-width: 1024px) {
      #scrim {
        display: none;
      }
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 44px;
      padding: 0 14px;
      border-radius: 10px;
      color: #a3a79c;
      font-size: 14px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: all .15s;
    }

    .nav-item:hover:not(.disabled) {
      color: #fff;
      background: rgba(255, 255, 255, .05);
    }

    .nav-item.active {
      background: #CCFF00;
      color: #050505;
    }

    .nav-item.disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .nav-item.disabled .pill {
      margin-left: auto;
    }

    /* ---- list rows (portfolio + hero banners) ---- */
    .vrow {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, .09);
      border-radius: 12px;
    }

    .reorder-grp {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex-shrink: 0;
    }

    .reorder-grp .btn-icon {
      min-height: 20px;
      height: 20px;
      width: 28px;
      font-size: 11px;
      line-height: 1;
    }

    /* ---- modal (shared by video + banner forms) ---- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }

    @media (min-width: 640px) {
      .modal-overlay {
        align-items: center;
        padding: 20px;
      }
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, .75);
    }

    .modal-panel {
      position: relative;
      width: 100%;
      max-width: 560px;
      max-height: 92vh;
      overflow-y: auto;
      background: #0d0f0d;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 18px 18px 0 0;
      padding: 22px;
      transform: translateY(16px);
      transition: transform .25s ease;
    }

    @media (min-width: 640px) {
      .modal-panel {
        border-radius: 16px;
        transform: translateY(8px) scale(.98);
      }
    }

    .modal-overlay.open .modal-panel {
      transform: none;
    }

    /* ---- mini live preview (scoped so it never collides with the real site's classes) ---- */
    .pv-hero {
      position: relative;
      aspect-ratio: 16/7;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .1);
      background: linear-gradient(135deg, #14170f, #050505);
    }

    .pv-hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, .85), transparent 60%);
    }

    .pv-hero .txt {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 10px;
      z-index: 1;
    }

    .pv-strip-item {
      position: relative;
      flex: 0 0 auto;
      width: 96px;
      height: 60px;
      border-radius: 8px;
      background: #0a0a0a center/cover;
      border: 1px solid rgba(255, 255, 255, .1);
      overflow: hidden;
    }

    .pv-strip-item.first {
      border-color: #CCFF00;
      box-shadow: 0 0 0 1px rgba(204, 255, 0, .5);
    }

    .pv-strip-item span {
      position: absolute;
      top: 3px;
      left: 3px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      background: rgba(0, 0, 0, .65);
      color: #CCFF00;
      padding: 1px 4px;
      border-radius: 4px;
    }

    .pv-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .pv-item {
      aspect-ratio: 16 / 9;
      border-radius: 6px;
      display: flex;
      align-items: flex-end;
      padding: 6px 8px;
      overflow: hidden;
      font: 500 10px 'JetBrains Mono', monospace;
      color: #CCFF00;
      background: linear-gradient(135deg, #14170f, #0a0a0a);
      border: 1px solid rgba(255, 255, 255, .08);
    }

  </style>
</head>

<body class="bg-ink text-[#eef0ec] antialiased">

  <aside id="sidebar">
    <div class="px-5 h-16 flex items-center border-b border-white/10 shrink-0">
      <div>
        <p class="font-mono text-[10px] text-muted leading-none">ADMIN_PANEL</p>
        <p class="font-display font-semibold mt-1">Portfolio CMS</p>
      </div>
    </div>
    <nav id="sideNav" class="flex-1 p-3 space-y-1"></nav>
    <div class="p-3 border-t border-white/10 space-y-2">
      <button id="exportBtn" class="btn btn-primary w-full" type="button">⭳ Publish</button>
      <button id="resetBtn" class="btn btn-sm w-full" type="button">Reset demo data</button>
    </div>
  </aside>
  <div id="scrim"></div>

  <div class="lg:pl-[260px] min-h-screen">
    <header
      class="sticky top-0 z-40 h-14 flex items-center gap-3 px-4 sm:px-6 lg:px-10 bg-ink/90 backdrop-blur border-b border-white/10">
      <button id="menuBtn" class="lg:hidden btn btn-sm" style="min-height:38px;width:38px;padding:0" type="button"
        aria-label="Open menu">☰</button>
      <p id="pageTitle" class="font-display font-semibold flex-1"></p>
      <span class="pill hidden sm:inline-flex">Static site · saved to this browser</span>
    </header>
    <main id="view" class="p-4 sm:p-6 lg:p-10 max-w-4xl mx-auto"></main>
  </div>

  <!-- Add / Edit PORTFOLIO video modal -->
  <div id="videoModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-backdrop" data-close-video></div>
    <div class="modal-panel">
      <div class="flex items-center justify-between mb-5">
        <p id="videoModalTitle" class="card-title">Add video</p><button class="btn btn-sm btn-icon" type="button"
          aria-label="Close" data-close-video>✕</button>
      </div>
      <form id="videoForm" class="space-y-4">
        <input type="hidden" id="v-id" />
        <label class="block"><span class="label">PROJECT TITLE</span><input id="v-title" class="input" maxlength="120"
            required /></label>
        <label class="block"><span class="label">CATEGORY</span><select id="v-category" class="input"></select></label>
        <label class="block"><span class="label">VIDEO URL (MP4)</span><input id="v-video" class="input" type="url"
            placeholder="https://vimeo.com/123456789   or   https://…/clip.mp4" required /></label>
        <label class="block"><span class="label">THUMBNAIL IMAGE URL (the cover shown in All Work — empty = automatic cover from the video)</span><input id="v-thumb" class="input" type="url"
            placeholder="https://…/thumbnail.jpg" /></label>
        <label class="flex items-start gap-3 cursor-pointer" style="display:flex;align-items:flex-start;gap:12px;cursor:pointer">
          <input type="checkbox" id="v-hide-all" style="width:18px;height:18px;margin-top:2px;accent-color:#CCFF00;flex:none" />
          <span><span class="label" style="display:block">HIDE FROM "ALL" TAB</span><span class="hint">When ON, this video is NOT shown under the "All" tab on the website. It still appears under its own category tab (e.g. UGC, 9:16, 16:9).</span></span>
        </label>
        <label class="block"><span class="label">TOOLS USED</span><input id="v-tools" class="input"
            placeholder="Runway Gen-3, Midjourney, DaVinci Resolve" /><span class="hint">Comma-separated — shown as tags
            in the cinematic modal.</span></label>
        <label class="block"><span class="label">DETAILED DESCRIPTION</span><textarea id="v-desc" class="input" rows="4"
            placeholder="Shown inside the frontend case-study modal."></textarea></label>
        <p id="v-error" class="text-sm text-red-400 hidden"></p>
        <div class="savebar"><button type="button" class="btn" data-close-video>Cancel</button><button type="submit"
            class="btn btn-primary">Save video</button></div>
      </form>
    </div>
  </div>

  <!-- Add / Edit HERO BANNER modal -->
  <div id="bannerModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-backdrop" data-close-banner></div>
    <div class="modal-panel">
      <div class="flex items-center justify-between mb-5">
        <p id="bannerModalTitle" class="card-title">Add hero banner</p><button class="btn btn-sm btn-icon" type="button"
          aria-label="Close" data-close-banner>✕</button>
      </div>
      <form id="bannerForm" class="space-y-4">
        <input type="hidden" id="b-id" />
        <label class="block"><span class="label">TITLE</span><input id="b-title" class="input" maxlength="120" required
            placeholder="Solstice" /></label>
        <label class="block"><span class="label">SUBTITLE / TAGLINE</span><input id="b-subtitle" class="input"
            maxlength="160" placeholder="A generative-first spot for a fragrance launch." /></label>
        <label class="block"><span class="label">VIDEO URL (MP4)</span><input id="b-video" class="input" type="url"
            placeholder="https://vimeo.com/123456789   or   https://…/clip.mp4" required /></label>
        <label class="block"><span class="label">THUMBNAIL IMAGE URL (optional — shown instantly while the video loads)</span><input id="b-thumb" class="input" type="url"
            placeholder="https://…/thumbnail.jpg" /></label>
        <label class="block"><span class="label">VIDEO FORMAT (so vertical videos fit correctly)</span>
          <select id="b-aspect" class="input">
            <option value="">Auto-detect</option><option value="16:9">Horizontal — 16:9</option><option value="9:16">Vertical — 9:16</option>
            <option value="1:1">Square — 1:1</option><option value="4:5">Portrait — 4:5</option>
          </select></label>
        <label class="block"><span class="label">TOOLS USED</span><input id="b-tools" class="input"
            placeholder="Runway Gen-3, Midjourney, DaVinci Resolve" /><span class="hint">Comma-separated — shown as tags
            in the cinematic case-study pop-up.</span></label>
        <label class="block"><span class="label">DETAILED DESCRIPTION / CASE STUDY</span><textarea id="b-desc"
            class="input" rows="4"
            placeholder="Shown when a visitor clicks this banner — opens the same cinematic modal as portfolio items."></textarea></label>
        <p id="b-error" class="text-sm text-red-400 hidden"></p>
        <div class="savebar"><button type="button" class="btn" data-close-banner>Cancel</button><button type="submit"
            class="btn btn-primary">Save banner</button></div>
      </form>
    </div>
  </div>


  <!-- Add / Edit COMMERCIAL / SHORT MOVIES video modal -->
  <div id="archiveModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-backdrop" data-close-archive></div>
    <div class="modal-panel">
      <div class="flex items-center justify-between mb-5">
        <p id="archiveModalTitle" class="card-title">Add archive video</p><button class="btn btn-sm btn-icon" type="button"
          aria-label="Close" data-close-archive>✕</button>
      </div>
      <form id="archiveForm" class="space-y-4">
        <input type="hidden" id="a-id" />
        <label class="block"><span class="label">TITLE</span><input id="a-title" class="input" maxlength="120" required
            placeholder="Solstice" /></label>
        <label class="block"><span class="label">SUBTITLE / TAGLINE</span><input id="a-subtitle" class="input"
            maxlength="160" placeholder="A generative-first spot for a fragrance launch." /></label>
        <label class="block"><span class="label">VIDEO URL (MP4)</span><input id="a-video" class="input" type="url"
            placeholder="https://vimeo.com/123456789   or   https://…/clip.mp4" required /></label>
        <label class="block"><span class="label">THUMBNAIL IMAGE URL (optional — shown instantly while the video loads)</span><input id="a-thumb" class="input" type="url"
            placeholder="https://…/thumbnail.jpg" /></label>
        <label class="block"><span class="label">VIDEO FORMAT (so vertical videos fit correctly)</span>
          <select id="a-aspect" class="input">
            <option value="">Auto-detect</option><option value="16:9">Horizontal — 16:9</option><option value="9:16">Vertical — 9:16</option>
            <option value="1:1">Square — 1:1</option><option value="4:5">Portrait — 4:5</option>
          </select></label>
        <label class="block"><span class="label">TOOLS USED</span><input id="a-tools" class="input"
            placeholder="Runway Gen-3, Midjourney, DaVinci Resolve" /><span class="hint">Comma-separated — shown as tags
            in the cinematic case-study pop-up.</span></label>
        <label class="block"><span class="label">DETAILED DESCRIPTION / CASE STUDY</span><textarea id="a-desc"
            class="input" rows="4"
            placeholder="Shown when a visitor clicks this video — opens the same cinematic modal as portfolio items."></textarea></label>
        <p id="a-error" class="text-sm text-red-400 hidden"></p>
        <div class="savebar"><button type="button" class="btn" data-close-archive>Cancel</button><button type="submit"
            class="btn btn-primary">Save video</button></div>
      </form>
    </div>
  </div>

  <script>
    /* ==========================================================================
       DATA — shape matches window.SITE_DATA written by "Publish (Download data.js)":
         SITE_DATA = { hero: { headline, subheadline, banners[] }, about, seo, filters,
                       social, categoryLabel, portfolio[] }
       hero.banners[] = multiple full-width hero banners (Billy-Bowman-style),
       each independently playable AND clickable to open the same cinematic
       case-study modal as a portfolio item. Array order === render order on the
       live site — reorder with the ↑ / ↓ controls below, no separate index field
       needed. Portfolio items work the same way.
       ========================================================================== */
    const STORAGE_KEY = 'aivp_admin_data_v2';
    const DEFAULT_DATA = {
      hero: {

          { id: 2, title: "Glass Hour", subtitle: "A short narrative piece exploring memory.", videoUrl: "https://storage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4", description: "A short narrative piece exploring memory, generated frame-by-frame and hand-graded for a filmic tone.", tools: ["Runway Gen-3", "ElevenLabs"] },
          { id: 3, title: "Aether", subtitle: "A brand film for a sustainable materials studio.", videoUrl: "https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4", description: "A brand film for a sustainable materials studio, pairing generated textures with macro live footage.", tools: ["Runway Gen-3", "Midjourney", "DaVinci Resolve"] },
        ],
      },

        workflow: [
          { title: "Concept & script", text: "Defining story, shot list and reference world before anything is generated." },
          { title: "AI generation", text: "Directing footage through generative models, iterating for consistency." },
          { title: "Edit & grade", text: "Cutting the story for real, then color and finishing in a proper NLE." },
          { title: "Sound & delivery", text: "Sound design, mix, and exports tailored to every platform it ships on." },
        ],
      },
      seo: { siteTitle: "Osman Onur Tekin — AI Video Editor & Producer", metaDescription: "Osman Onur Tekin — AI-native video editor and producer. Selected commercial, narrative and vertical work.", logoText: "Osman Tekin", email: "", formspreeEndpoint: "" },
      social: { instagram: "", youtube: "", linkedin: "" },
      commercial: [],                                                // Commercial page (banner-style videos)
      shortMovies: [],                                               // Short Movies page (banner-style videos)
      shortFormVideo: [],                                            // Short-form Video page (banner-style videos)
      filters: [{ label: "9:16", value: "9:16" }, { label: "16:9", value: "16:9" }, { label: "UGC", value: "ugc" }],

    const clone = o => JSON.parse(JSON.stringify(o));
    function loadState() { try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch (e) { console.warn('Could not read saved data, using defaults.', e); } return clone(DEFAULT_DATA); }
    function migrate(s) {                                   // fills in fields added by later steps for existing localStorage saves
      s.about = { ...clone(DEFAULT_DATA.about), ...s.about };
      s.seo = { ...clone(DEFAULT_DATA.seo), ...(s.seo || {}) };
      s.social = { ...clone(DEFAULT_DATA.social), ...(s.social || {}) };
      // "archive" (Work Archive) was the first name of Commercial: carry it over once, so nothing already added is lost.
      if (!Array.isArray(s.commercial)) s.commercial = Array.isArray(s.archive) ? s.archive : [];
      delete s.archive;
      if (!Array.isArray(s.shortMovies)) s.shortMovies = [];                       // Commercial, Short Movies and Short-form Video: own lists, never derived from banners / work
      if (!Array.isArray(s.shortFormVideo)) s.shortFormVideo = [];
      for (const key of ['commercial', 'shortMovies', 'shortFormVideo']) {
        let nextId = s[key].reduce((m, a) => Math.max(m, a.id || 0), 0) + 1;
        s[key] = s[key].map(a => ({ ...a, id: a.id || nextId++, title: a.title || '', subtitle: a.subtitle || '', videoUrl: a.videoUrl || '',
          thumbnailUrl: a.thumbnailUrl || '', aspect: a.aspect || '', description: a.description || '', tools: Array.isArray(a.tools) ? [...a.tools] : [] }));
      }          // footer links (Instagram / YouTube / LinkedIn); e-mail comes from seo.email
      if (!Array.isArray(s.about.workflow) || !s.about.workflow.length) s.about.workflow = clone(DEFAULT_DATA.about.workflow);

      // hero: upgrade every banner to the full schema (id / subtitle / description / tools),
      // and migrate a legacy single `featuredVideoIds: [id]` pointer into an independent banner
      // so nobody's existing featured video silently disappears when this step lands.
      // Banners and All Work are TWO SEPARATE LISTS (s.hero.banners / s.portfolio). Defaults are only seeded when the list does not
      // exist at all — an intentionally emptied banner list stays empty. Every banner field is preserved (no rebuild-from-a-short-list),
      // and the legacy pointer migration DEEP-COPIES so a banner can never share an object with a work item.
      if (!Array.isArray(s.hero.banners)) {
        const fromOld = (s.hero.featuredVideoIds || []).map(id => (s.portfolio || []).find(v => v.id === id)).filter(Boolean)
          .map(p => ({ title: p.title, videoUrl: p.videoUrl, subtitle: '', description: p.description || '', tools: [...(p.tools || [])] }));
        s.hero.banners = fromOld.length ? fromOld : clone(DEFAULT_DATA.hero.banners);
      }
      let nextBid = s.hero.banners.reduce((m, b) => Math.max(m, b.id || 0), 0) + 1;
      s.hero.banners = s.hero.banners.map(b => ({
        ...b,                                                  // keep EVERYTHING (thumbnailUrl, aspect, future fields)
        id: b.id || nextBid++, title: b.title || '', subtitle: b.subtitle || '', videoUrl: b.videoUrl || '',
        description: b.description || '', tools: Array.isArray(b.tools) ? [...b.tools] : [],
      }));
      delete s.hero.featuredVideoIds;
      // thumbnailUrl is optional; make sure every banner / video has the field so the forms and preview never see undefined
      s.hero.banners.forEach(b => { b.thumbnailUrl = b.thumbnailUrl || ''; });
      (s.portfolio || []).forEach(v => { v.thumbnailUrl = v.thumbnailUrl || ''; });
      s.hero.banners.forEach(b => { b.aspect = b.aspect || ''; });
      // The ONLY categories are 9:16, 16:9 and UGC. Older saves are mapped: "vertical" → 9:16, any other old category → 16:9.
      s.filters = clone(DEFAULT_DATA.filters); s.categoryLabel = clone(DEFAULT_DATA.categoryLabel);
      (s.portfolio || []).forEach(v => { if (!s.categoryLabel[v.category]) v.category = v.category === 'vertical' ? '9:16' : '16:9'; });
      if (!s.stills || !Array.isArray(s.stills.sections)) s.stills = { title: '', sections: [] };   // Stills (picture gallery)
      return s;

    /* ---------- ISOLATION GUARD ----------
       STATE.hero.banners (hero) and STATE.portfolio (All Work) are independent data models with their own id counters.
       Every create / edit / delete / reorder goes through commitBanners(), commitWork() or commitCollection(). Each one snapshots the OTHER list
       first and, if anything it did changed that other list, restores it and reports — so no code path (present or future)
       can make an All Work change touch a banner or the other way round. */
    const SLICES = {
      banners: { get: () => STATE.hero.banners, set: v => { STATE.hero.banners = v; } },
      work:    { get: () => STATE.portfolio,    set: v => { STATE.portfolio = v; } },
      commercial:  { get: () => STATE.commercial,  set: v => { STATE.commercial = v; } },     // Commercial page — its own list
      shortMovies: { get: () => STATE.shortMovies, set: v => { STATE.shortMovies = v; } },    // Short Movies page — its own list
      shortFormVideo: { get: () => STATE.shortFormVideo, set: v => { STATE.shortFormVideo = v; } }, // Short-form Video page — its own list
    };
    function commit(owner, mutate) {
      const others = Object.keys(SLICES).filter(k => k !== owner);
      const before = Object.fromEntries(others.map(k => [k, JSON.stringify(SLICES[k].get())]));
      mutate();
      others.forEach(k => {
        if (JSON.stringify(SLICES[k].get()) !== before[k]) {
          SLICES[k].set(JSON.parse(before[k]));
          console.error('[isolation] "' + owner + '" change tried to modify "' + k + '" — reverted.');
        }
      });
      persist();
    }
    const commitBanners = fn => commit('banners', fn);
    const commitWork = fn => commit('work', fn);
    const commitCollection = (key, fn) => commit(key, fn);          // key: 'commercial' | 'shortMovies'

    const $ = (sel, root = document) => root.querySelector(sel);
    function moveInArray(arr, index, dir) { const j = index + dir; if (j < 0 || j >= arr.length) return false;[arr[index], arr[j]] = [arr[j], arr[index]]; return true; }

          let data = {}; try { data = await res.json(); } catch (_) { }
          if (!res.ok || (data.errors && data.errors.length) || data.success === 'false') throw new Error((data.errors && data.errors[0] && data.errors[0].message) || data.message || 'HTTP ' + res.status);
          toast(route.provider === 'formsubmit' ? 'Sent — check Gmail for the FormSubmit activation email (also spam).' : 'Test sent — check your inbox.');
        } catch (err) { console.error(err); toast('Test failed: ' + err.message); }
        btn.disabled = false;
      });
    }

    /* ================= Publish — instant, via localStorage (no file downloads) ================= */
    // Instant publish: write a snapshot of the current state to localStorage under a separate "published" key.
    // index.html reads this key on load (and live-reloads via the 'storage' event), so no file download is needed.
    const PUBLISHED_KEY = 'siteData';
    $('#exportBtn').addEventListener('click', async () => {
      const btn = $('#exportBtn'), label = btn.textContent;
      try {                                                           // 1) instant in THIS browser (works even without the server)
        persist();
        STATE.publishedAt = Date.now();
        localStorage.setItem(PUBLISHED_KEY, JSON.stringify(STATE));
        persist();
      } catch (e) {
        console.error('Publish failed', e);
        return toast('Publish failed: browser storage is full or unavailable.');
      }
      btn.disabled = true; btn.textContent = 'Publishing…';
      try {                                                           // 2) live for EVERY visitor (saved on Vercel; /data.js serves it)
        const res = await fetch('/api/publish', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(STATE) });
        const body = await res.json().catch(() => ({}));
        if (res.ok && body.ok) {
          STATE.publishedAt = body.publishedAt; persist(); localStorage.setItem(PUBLISHED_KEY, JSON.stringify(STATE));
          toast('Published — live for everyone.');
        } else if (res.status === 401) toast('Saved in this browser only — please reload this page and log in again, then Publish.');
        else if (res.status === 503) toast('Saved in this browser only — the Vercel database is not connected yet (see setup steps).');
        else if (res.status === 404) toast('Saved in this browser only — live publishing works on your Vercel site, not on a local file.');
        else if (res.status === 413) toast('Saved in this browser only — the data is too large to publish.');
        else toast('Saved in this browser only — the server could not publish (' + (body.error || res.status) + ').');
      } catch (e) {
        console.error('Server publish failed', e);
        toast('Saved in this browser only — could not reach the server.');
      } finally { btn.disabled = false; btn.textContent = label; }
    });
    $('#resetBtn').addEventListener('click', () => {
      if (!confirm('Reset to the original demo content? Your edits in this browser will be lost.')) return;
      STATE = clone(DEFAULT_DATA); persist(); goTo(activeView); toast('Reset to defaults.');
    });

    /* ---------------- boot ---------------- */
    renderNav(); goTo('hero');
  </script>
</body>

</html>
